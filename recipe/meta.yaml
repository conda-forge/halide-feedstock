{% set name = "halide" %}
{% set version = "22.0.0.post2" %}
{% set sha256 = "bcc343b028a3f966635db254e46257c44943c3cf0c788f2a0c6c429000be8509" %}
{% set build = 0 %}
{% set llvm_version = 22 %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/halide/Halide/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: {{ build }}
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage("halide") }}
  ignore_run_exports:
    # used only at build time (flatc and headers)
    - flatbuffers

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
  host:
    - clangdev   {{ llvm_version }}.*
    - llvmdev    {{ llvm_version }}.*
    - llvm       {{ llvm_version }}.*
    - lld        {{ llvm_version }}.*
    - flatbuffers
    - openssl  # libwabt.a links libcrypto
    - wabt

test:
  requires:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  files:
    - test.cpp

outputs:
  - name: halide

  - name: halide-python
    script: install-python.sh
    build:
      # Halide's Python bindings require CPython 3.12+
      skip: true  # [py<312]
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cmake
        - make
      host:
        - python
        - nanobind >=2.11
        - {{ pin_subpackage("halide", exact=True) }}
      run:
        - {{ pin_subpackage("halide", exact=True) }}
        - python
        - imageio
        - numpy
    test:
      requires:
        - pip
      imports:
        - halide
        - halide.runtime
      commands:
        - pip check
        - python -c "import halide as hl; f = hl.Func('f'); x = hl.Var('x'); f[x] = x * 2; assert f.realize([4])[3] == 6"
    about:
      summary: 'python bindings for halide programming language'

about:
  home: http://halide-lang.org
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: 'a language for image processing and computational photography'
  description: |
    Halide is a programming language designed to make it easier to write
    high-performance data parallel processing code on modern machines.
    Its current front end is embedded in C++. Compiler targets include
    x86/SSE, ARM v7/NEON, CUDA, Hexagon DSP, and OpenCL.
  doc_url: http://halide-lang.org/docs/
  dev_url: https://github.com/halide/Halide

extra:
  recipe-maintainers:
    - jrk
    - minrk
    - steven-johnson
    - isuruf
    - alexreinking
